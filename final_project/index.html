<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Pothole Detection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    /* POTHOLE BACKGROUND IMAGE */
    background:url("{{ url_for('static', filename='background_image.png') }}") no-repeat center center;
    background-size:cover;
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:0;
}

/* GLASS CONTAINER */
.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:950px;
    padding:45px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    box-shadow:0 25px 60px rgba(0,0,0,0.7);
    text-align:center;
    color:white;
}

.title{
    font-size:38px;
    font-weight:600;
    margin-bottom:10px;
    color:#ffcc70;
}

.subtitle{
    color:#ddd;
    margin-bottom:35px;
}

.upload-box{
    border:2px dashed rgba(255,255,255,0.6);
    border-radius:15px;
    padding:40px;
    transition:0.3s;
    cursor:pointer;
}

.upload-box:hover{
    background:rgba(255,255,255,0.1);
    transform:scale(1.03);
}

input[type=file]{
    margin-top:15px;
    color:white;
}

button{
    margin-top:25px;
    padding:14px 40px;
    border:none;
    border-radius:30px;
    font-size:16px;
    background:linear-gradient(45deg,#ff7e5f,#ff3f34);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.result{
    margin-top:40px;
}

.result img{
    max-width:100%;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.section-title{
    margin-top:30px;
    font-size:22px;
    color:#ffd369;
}

.footer{
    margin-top:35px;
    font-size:14px;
    color:#ccc;
}

</style>

</head>

<body>

<div class="container">

<div class="title">🚧 AI Pothole Detection</div>

<div class="subtitle">
Upload Image or Video to Detect Road Potholes & Recommended Speed
</div>

<form method="POST" enctype="multipart/form-data">

<div class="upload-box">
📁 Drag & Drop or Select File <br>
<input type="file" name="file" required>
</div>

<button type="submit">Detect Potholes</button>

</form>

<div class="result">

{% if output_image %}

<div class="section-title">Detected Image</div>
<img src="{{ url_for('static', filename=output_image) }}">
{% endif %}

{% if video_stream %}

<div class="section-title">Detected Video Stream</div>
<img src="{{ url_for('index') }}">
{% endif %}

</div>

<div class="footer">
AI Powered Smart Road Monitoring System
</div>

</div>

</body>
</html>
